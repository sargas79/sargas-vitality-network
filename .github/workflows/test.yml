# Syntax-checks every script and runs the mock-Foundry logic tests.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate module.json
        run: node -e "JSON.parse(require('fs').readFileSync('module.json', 'utf8'))"

      - name: Syntax-check scripts
        run: for f in scripts/*.js scripts/handlers/*.js; do node --input-type=module --check < "$f"; done

      - name: Logic tests
        run: node tests/logic.test.mjs
